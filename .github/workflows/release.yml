name: Release

# Pushing a v* tag is the entire release process: a tag on its own is only a
# git ref, so this workflow is what turns it into the GitHub release HACS
# reads. The version in manifest.json is written from the tag here, so the
# file in the repository is a placeholder and never has to be bumped by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish the HACS archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Write the tag into the manifest
        run: |
          version="${GITHUB_REF_NAME#v}"
          manifest=custom_components/ventilation_reminder/manifest.json
          sed -E -i "s/(\"version\"[[:space:]]*:[[:space:]]*\")[^\"]*(\")/\1$version\2/" "$manifest"
          jq -e --arg v "$version" '.version == $v' "$manifest" >/dev/null ||
            { echo "failed to write version $version into $manifest" >&2; exit 1; }

      - name: Build the archive
        # HACS expects the integration's contents at the root of the zip
        run: |
          cd custom_components/ventilation_reminder
          zip -r ../../ventilation_reminder.zip . -x '__pycache__/*' '*.pyc'

      # --generate-notes lets GitHub write the changelog from the commits
      # since the previous release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ventilation_reminder.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
